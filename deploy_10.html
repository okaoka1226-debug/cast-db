// 保存済みトークンを読み込む
window.onload=function(){
  const saved=localStorage.getItem('gh_token');
  if(saved) document.getElementById('tokenInput').value=saved;
};

function log(msg,cls){
  const el=document.getElementById('log');
  el.innerHTML+=`<div class="${cls||'info'}">${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

async function deploy(){
  const token=document.getElementById('tokenInput').value.trim();
  if(!token){alert('トークンを入力してください');return;}
  localStorage.setItem('gh_token',token);
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='更新中...';
  try{
    log('GitHubのファイル情報を取得中...');
    const res=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}
    });
    const data=await res.json();
    if(!data.sha) throw new Error('SHA取得失敗: '+JSON.stringify(data));
    log('✓ SHA取得完了','ok');
    log('GitHubにコードをアップロード中...');
    const upRes=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Update cast_db from deploy tool',content:NEW_CONTENT,sha:data.sha})
    });
    const upData=await upRes.json();
    if(upData.content){
      log('✓ GitHubに反映完了！','ok');
      log('Netlifyが自動デプロイ中... 約30秒後に確認してください','ok');
      setTimeout(()=>log('<a href="https://sage-clafoutis-50c320.netlify.app" target="_blank">→ アプリを開く</a>','ok'),30000);
    }else{
      throw new Error(JSON.stringify(upData));
    }
  }catch(e){
    log('❌ エラー: '+e.message,'err');
  }
  btn.disabled=false;btn.textContent='▶ GitHubに反映する';
}
</script>
