<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>キャスト管理DB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--bg2:#1a1a1f;--bg3:#222228;--border:#2e2e38;
  --text:#f0f0f5;--text2:#9090a8;--text3:#5a5a72;
  --accent:#a78bfa;--accent2:#7c5cf6;--success:#34d399;--danger:#f87171;--warn:#fbbf24;
  --radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh}
.app{max-width:420px;margin:0 auto;padding:0 0 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px}
.topbar-title{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.topbar-title span{color:var(--accent)}
.icon-btn{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text2)}
.add-btn-main{background:var(--accent2);border:none;border-radius:var(--radius-sm);padding:0 16px;height:36px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Noto Sans JP',sans-serif}
.sync-status{margin:0 16px 8px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%}
.key-banner{margin:0 16px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12px;color:var(--text2)}
.key-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tab-bar{display:flex;margin:0 16px 16px;background:var(--bg2);border-radius:var(--radius-sm);padding:4px;gap:2px}
.tab{flex:1;padding:8px 0;font-size:11px;font-weight:500;text-align:center;color:var(--text3);cursor:pointer;border:none;background:none;border-radius:6px;font-family:'Noto Sans JP',sans-serif}
.tab.active{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.sec{display:none;padding:0 16px}.sec.active{display:block}
.cast-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer}
.cast-card.alert{border-color:var(--danger)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.stat-l{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-v{font-size:18px;font-weight:700}
.empty{text-align:center;padding:60px 16px;color:var(--text3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:16px}
.fl{font-size:12px;color:var(--text2);margin-bottom:6px;display:block}
.fg{margin-bottom:14px}
input,textarea{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;font-family:'Noto Sans JP',sans-serif}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;line-height:1.6}
.brow{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-weight:700;font-family:'Noto Sans JP',sans-serif}
.btn-p{background:var(--accent2);color:#fff;border:none}
.btn-c{background:none;border:1px solid var(--border);color:var(--text2)}
.btn-danger{background:none;border:1px solid var(--danger);color:var(--danger)}
.detail-view{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:50;max-width:420px;margin:0 auto}
.detail-inner{padding:16px 16px 80px}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);background:none;border:none;cursor:pointer;padding:0;margin-bottom:20px;font-family:'Noto Sans JP',sans-serif}
.sec-label{font-size:11px;color:var(--text3);font-weight:700;margin:20px 0 8px;letter-spacing:1px;text-transform:uppercase}
.info-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.7}
.trend-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.trend-label{min-width:48px;color:var(--text2)}
.trend-bar-bg{flex:1;background:var(--bg3);border-radius:99px;height:6px;overflow:hidden}
.trend-bar{height:6px;border-radius:99px}
.trend-val{min-width:36px;text-align:right;font-weight:700}
.add-mini-btn{width:100%;padding:10px;font-size:13px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:none;color:var(--text3);cursor:pointer;margin-top:8px;font-family:'Noto Sans JP',sans-serif}
.chat-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:8px}
.chat-msgs{min-height:60px;max-height:300px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.msg{font-size:13px;line-height:1.7;padding:10px 12px;border-radius:var(--radius-sm);max-width:95%}
.msg-user{background:var(--accent2);color:#fff;align-self:flex-end}
.msg-ai{background:var(--bg3);border:1px solid var(--border);align-self:flex-start;color:var(--text)}
.msg-thinking{color:var(--text3);font-size:12px;align-self:flex-start;padding:6px 0}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row textarea{font-size:13px;padding:8px 12px;min-height:38px;max-height:80px}
.chat-send{flex-shrink:0;width:38px;height:38px;border-radius:var(--radius-sm);background:var(--accent2);color:#fff;border:none;cursor:pointer;font-size:18px}
.hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.hist-date{font-size:11px;color:var(--text3);margin-bottom:6px}
.hist-content{font-size:13px;color:var(--text2);line-height:1.7}
.alert-badge{font-size:10px;background:rgba(248,113,113,0.2);color:var(--danger);border:1px solid var(--danger);border-radius:99px;padding:2px 7px;margin-left:6px}
.warn-badge{font-size:10px;background:rgba(251,191,36,0.2);color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:2px 7px;margin-left:6px}
/* 今日の出勤タブ */
.attend-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.attend-card.working{border-color:var(--success)}
.tap-btn{border:none;border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.15s}
.tap-btn.on{background:var(--success);color:#0f1f17}
.tap-btn.off{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.tap-btn.photo-on{background:var(--accent2);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">Cast<span>DB</span></div>
    <button class="add-btn-main" onclick="openAdd()">＋ 追加</button>
  </div>
  <div style="padding:0 16px 12px">
    <input id="searchInput" type="text" placeholder="🔍 キャストを検索..." oninput="renderList()" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;padding:10px 14px;width:100%;color:var(--text)"/>
  </div>
  <div id="syncStatus" class="sync-status"><div class="sync-dot" style="background:var(--text3)"></div><span>接続中...</span></div>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('list',this)">一覧</button>
    <button class="tab" onclick="switchTab('today',this)">出勤記録</button>
    <button class="tab" onclick="switchTab('ranking',this)">売上</button>
    <button class="tab" onclick="switchTab('consult',this)">相談</button>
    <button class="tab" onclick="switchTab('settings',this)">⚙️</button>
  </div>
  <div id="list" class="sec active"></div>
  <div id="today" class="sec"></div>
  <div id="ranking" class="sec"></div>
  <div id="consult" class="sec"></div>
  <div id="settings" class="sec"></div>
</div>

<!-- APIキー -->
<div id="keyModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeKeyModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">🔑 Anthropic APIキー設定</p>
      <div class="fg">
        <label class="fl">APIキー</label>
        <input id="keyInput" type="text" placeholder="sk-ant-..." autocomplete="off"/>
        <div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.7">このデバイスにのみ保存されます。<br>取得：<a href="https://console.anthropic.com" target="_blank" style="color:var(--accent)">console.anthropic.com</a></div>
      </div>
      <div class="brow">
        <button class="btn btn-c" onclick="clearKey()">削除</button>
        <button class="btn btn-p" onclick="saveKey()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- キャスト追加/編集 -->
<div id="addModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeAdd()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p id="addTitle" class="sheet-title">キャスト追加</p>
      <div class="fg"><label class="fl">源氏名</label><input id="f-name" placeholder="例：さくら"/></div>
      <div class="fg"><label class="fl">年齢</label><input id="f-age" type="number" placeholder="20" min="18"/></div>
      <div class="fg"><label class="fl">入店日</label><input id="f-tenure" type="date"/></div>
      <div class="fg"><label class="fl">プロフURL（任意）</label><input id="f-url" placeholder="https://..."/></div>
      <div class="fg"><label class="fl">強み・特徴</label><textarea id="f-strength" rows="2" placeholder="明るい、常連が多いなど"></textarea></div>
      <div class="fg"><label class="fl">課題・弱み</label><textarea id="f-weakness" rows="2" placeholder="遅刻が多め、ドリンクバック率低いなど"></textarea></div>
      <div class="fg"><label class="fl">趣味・好きなもの</label><textarea id="f-interests" rows="2" placeholder="野球（阪神）、アニメ（〇〇）、歌手（〇〇）など"></textarea></div>
      <div class="fg"><label class="fl">メモ</label><textarea id="f-memo" rows="2" placeholder="直近の面談内容など"></textarea></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeAdd()">キャンセル</button>
        <button id="saveBtn" class="btn btn-p" onclick="saveNew()">保存</button>
      </div>
      <div id="deleteBtnWrap" style="display:none;margin-top:10px">
        <button class="btn btn-danger" onclick="deleteCast()">このキャストを削除する</button>
      </div>
    </div>
  </div>
</div>

<!-- 月次データ -->
<div id="monthModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeMonthModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">月次データを追加</p>
      <div class="fg"><label class="fl">年月</label><input id="m-ym" type="month"/></div>
      <div class="fg"><label class="fl">売上（万円）</label><input id="m-sales" type="number" placeholder="0" step="0.1"/></div>
      <div class="fg"><label class="fl">指名数</label><input id="m-shimei" type="number" placeholder="0"/></div>
      <div class="fg"><label class="fl">出勤数</label><input id="m-shifts" type="number" placeholder="0"/></div>
      <div class="fg"><label class="fl">写メUP数</label><input id="m-photos" type="number" placeholder="0"/></div>
      <div class="fg"><label class="fl">メモ</label><textarea id="m-memo" rows="2" placeholder="今月の特記事項など"></textarea></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeMonthModal()">キャンセル</button>
        <button class="btn btn-p" onclick="saveMonth()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 面談メモ -->
<div id="memoModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeMemoModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">メモを追加</p>
      <div class="fg"><label class="fl">日付</label><input id="memo-date" type="date"/></div>
      <div class="fg"><label class="fl">内容</label><textarea id="memo-content" rows="4" placeholder="○○さん最近アニメにハマってる、など何でもOK"></textarea></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeMemoModal()">キャンセル</button>
        <button class="btn btn-p" onclick="saveMemo()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 詳細 -->
<div id="detailView" style="display:none">
  <div class="detail-view">
    <div class="detail-inner">
      <button class="back-btn" onclick="closeDetail()">← 一覧に戻る</button>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, addDoc, arrayUnion, serverTimestamp, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAeSQpMbMASXGdNtKAkBFIAriuXEpilXzA",
  authDomain: "cast-management-47c1f.firebaseapp.com",
  projectId: "cast-management-47c1f",
  storageBucket: "cast-management-47c1f.firebasestorage.app",
  messagingSenderId: "1094441321205",
  appId: "1:1094441321205:web:b5daf7f9101042f1173bbc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const COLS=[
  {bg:'#3d2b6e',t:'#c4b5fd'},{bg:'#1a3a2e',t:'#6ee7b7'},
  {bg:'#3a1f1a',t:'#fca5a5'},{bg:'#2d1f3a',t:'#f0abfc'},
  {bg:'#1a2a3a',t:'#93c5fd'},{bg:'#1a3020',t:'#86efac'},
  {bg:'#3a2e1a',t:'#fde68a'},{bg:'#3a1f2a',t:'#f9a8d4'}
];

let casts=[], castsMap={};
let editTarget=null, monthTarget=null, memoTarget=null;
let chatHistories={};
let currentDetailId=null;
let todayAttendance={};
let attendanceDate=today();

function col(i){ return COLS[i%COLS.length]; }
function fmt(n){ return Number(n).toLocaleString('ja-JP'); }
function ini(n){ return n?n.slice(0,2):'?'; }
function today(){
  const now=new Date();
  // 朝5時前は前日扱い
  if(now.getHours()<5) now.setDate(now.getDate()-1);
  return now.toISOString().slice(0,10);
}
function thisMonth(){ return new Date().toISOString().slice(0,7); }
function daysSince(dateStr){
  if(!dateStr) return 999;
  // 朝5時を日付変更とする
  const now=new Date();
  const adjustedNow=new Date(now.getTime() - 5*60*60*1000);
  const target=new Date(dateStr+'T05:00:00');
  const diff=adjustedNow-target;
  return Math.floor(diff/86400000);
}
function lastMemoDate(c){
  if(!c.memos||!c.memos.length) return null;
  return c.memos.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].date;
}
function lastAttendDate(id){
  // 過去30日分チェック
  for(let i=0;i<=30;i++){
    const d=new Date();
    d.setDate(d.getDate()-i);
    const dateStr=d.toISOString().slice(0,10);
    const saved=lsGet('attend_'+dateStr);
    if(!saved) continue;
    const att=JSON.parse(saved);
    if(att[id]&&att[id].working) return dateStr;
  }
  return null;
}
function attendLabel(id){
  const date=lastAttendDate(id);
  if(!date) return null;
  const days=daysSince(date);
  if(days===0) return '今日出勤';
  if(days<=6) return `${days}日前出勤`;
  return '7日以上前出勤';
}
function attendLabelColor(id){
  const date=lastAttendDate(id);
  if(!date) return 'var(--text3)';
  const days=daysSince(date);
  if(days===0) return 'var(--success)';
  if(days<=3) return 'var(--accent)';
  if(days<=6) return 'var(--warn)';
  return 'var(--text3)';
}

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function getKey(){ return lsGet('cast_apikey')||''; }
function saveKey(){
  const v=document.getElementById('keyInput').value.trim();
  if(!v){ alert('APIキーを入力してください'); return; }
  lsSet('cast_apikey',v); closeKeyModal(); renderKeyBanner();
}
function clearKey(){ lsDel('cast_apikey'); document.getElementById('keyInput').value=''; closeKeyModal(); renderKeyBanner(); }
function openKeyModal(){ document.getElementById('keyInput').value=getKey(); document.getElementById('keyModal').style.display='block'; }
function closeKeyModal(){ document.getElementById('keyModal').style.display='none'; }
function renderKeyBanner(){ renderSettings(); }

function setSyncStatus(status){
  const el=document.getElementById('syncStatus');
  if(status==='ok') el.innerHTML=`<div class="sync-dot" style="background:#34d399"></div><span>同期済み</span>`;
  else if(status==='saving') el.innerHTML=`<div class="sync-dot" style="background:#fde68a"></div><span>保存中...</span>`;
  else el.innerHTML=`<div class="sync-dot" style="background:#f87171"></div><span>オフライン</span>`;
}

// 出勤データ管理（今日・昨日対応）
function getAttendanceHistory(castId, days=14){
  const result=[];
  for(let i=0;i<days;i++){
    const d=getDaysAgo(i);
    const saved=lsGet('attend_'+d);
    if(saved){
      const att=JSON.parse(saved);
      if(att[castId]&&att[castId].working) result.push(d);
    }
  }
  return result; // 新しい順
}

function getRecentAttendanceStatus(castId){
  const t=today();
  // 直近7日+今日の出勤状況
  const days=[];
  for(let i=0;i<=6;i++){
    const d=getDaysAgo(i);
    const saved=lsGet('attend_'+d);
    const working=saved?JSON.parse(saved)[castId]?JSON.parse(saved)[castId].working:false:false;
    days.push({date:d,working});
  }
  // 最終出勤日
  const lastWorked=days.find(d=>d.working);
  // 連勤計算（今日から連続して出勤している日数）
  let streak=0;
  for(const d of days){
    if(d.working) streak++;
    else break;
  }
  return {days, lastWorked:(lastWorked&&lastWorked.date)||null, streak};
}
function getYesterday(){
  const d=new Date(); d.setDate(d.getDate()-1);
  return d.toISOString().slice(0,10);
}
function getDaysAgo(n){
  const d=new Date(); d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}
function formatDateBtn(dateStr){
  const d=new Date(dateStr);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function loadAttendance(date){
  const saved=lsGet('attend_'+date);
  todayAttendance=saved?JSON.parse(saved):{};
  attendanceDate=date;
}
function saveAttendance(){
  lsSet('attend_'+attendanceDate,JSON.stringify(todayAttendance));
}
function switchAttendDate(date){
  loadAttendance(date);
  renderToday();
}
function toggleAttend(id){
  if(!todayAttendance[id]) todayAttendance[id]={working:false,photo:false};
  todayAttendance[id].working=!todayAttendance[id].working;
  if(!todayAttendance[id].working) todayAttendance[id].photo=false;
  saveAttendance();
  renderToday();
}
function togglePhoto(id){
  if(!todayAttendance[id]) todayAttendance[id]={working:false,photo:false};
  todayAttendance[id].photo=!todayAttendance[id].photo;
  saveAttendance();
  renderToday();
}
window.toggleAttend=toggleAttend;
window.togglePhoto=togglePhoto;
window.switchAttendDate=switchAttendDate;

const castsRef=collection(db,'casts');
onSnapshot(query(castsRef,orderBy('createdAt','asc')),(snapshot)=>{
  casts=[]; castsMap={};
  snapshot.forEach(docSnap=>{
    const data={id:docSnap.id,...docSnap.data()};
    casts.push(data); castsMap[docSnap.id]=data;
    if(data.chatHistory) chatHistories['cast_'+docSnap.id]=data.chatHistory;
  });
  render(); setSyncStatus('ok');
  if(currentDetailId&&castsMap[currentDetailId]){
    const idx=casts.findIndex(c=>c.id===currentDetailId);
    if(idx>=0) renderDetailContent(idx);
  }
},(err)=>{ setSyncStatus('error'); console.error(err); });

function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));

      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${c.profileUrl?`<a href="${c.profileUrl}" target="_blank" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:11px;color:var(--accent);text-decoration:none;text-align:center">HP</a>`:''}
        <button onclick="openEdit(${i})" style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:11px;cursor:pointer;color:var(--text2);font-family:'Noto Sans JP',sans-serif">編集</button>

async function sendChat(i){
  const c=casts[i];
  const inputEl=document.getElementById('chatInput_'+i);
  const text=inputEl.value.trim(); if(!text) return;
  inputEl.value='';
  const chatKey='cast_'+c.id;
  chatHistories[chatKey].push({role:'user',content:text});
  const msgsEl=document.getElementById('chatMsgs_'+i);
  msgsEl.innerHTML=renderChatHist(chatHistories[chatKey])+'<div class="msg-thinking">考え中...</div>';
  msgsEl.scrollTop=msgsEl.scrollHeight;

  const months=(c.monthly||[]).slice().sort((a,b)=>a.ym.localeCompare(b.ym));
  const monthsText=months.length?months.map(m=>`${m.ym}：売上${m.sales}万円 指名${m.shimei||'?'}本 出勤${m.shifts||'?'}回 写メUP${m.photos||'?'}枚${m.memo?' ('+m.memo+')':''}`).join('\n'):'月次データなし';
  const memosText=(c.memos||[]).length?(c.memos||[]).map(m=>`${m.date}：${m.content}`).join('\n'):'なし';

  const sys=`あなたはナイトワーク店舗のマネジメントアドバイザーです。以下のキャスト情報をもとに、オーナーの質問に的確で実践的なアドバイスを日本語で返してください。簡潔に、箇条書きも活用してください。

「会話ネタ」「話題」「ネタ」などのキーワードが含まれる質問の場合は、必ずweb_searchツールを使ってキャストの趣味・好きなものに関する最新ニュースや話題を検索してから回答してください。例：阪神の最新結果、好きなアニメの最新話、好きな歌手の新曲など。

【キャスト名】${c.name}
【年齢】${c.age||'不明'}歳
【入店日】${c.tenure||'不明'}
【趣味・好きなもの】${c.interests||'なし'}
【強み・特徴】${c.strength||'なし'}
【課題・弱み】${c.weakness||'なし'}
【月次データ（古い順）】
${monthsText}
【面談・メモ記録】
${memosText}`;

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,system:sys,messages:chatHistories[chatKey],tools:[{type:'web_search_20250305',name:'web_search'}]})
    });
    const data=await res.json();
    const blocks=data.content||[];
    const reply=blocks.filter(b=>b.type==='text').map(b=>b.text).join('\n')||(data.(error&&error.message)||'エラーが発生しました');
    chatHistories[chatKey].push({role:'assistant',content:reply});
    try{ await updateDoc(doc(db,'casts',c.id),{chatHistory:chatHistories[chatKey]}); }catch(e){ console.error('履歴保存失敗',e); }
  }catch(e){
    chatHistories[chatKey].push({role:'assistant',content:'通信エラー。APIキーと接続を確認してください。'});
  }
  msgsEl.innerHTML=renderChatHist(chatHistories[chatKey]);
  msgsEl.scrollTop=msgsEl.scrollHeight;
}

// 月次データ自動集計
async function autoAggregateMonth(){
  const ym=thisMonth();
  const daysInMonth=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  // 今月の全日付を生成
  const monthDates=[];
  for(let d=1;d<=new Date().getDate();d++){
    const dd=String(d).padStart(2,'0');
    const mm=String(new Date().getMonth()+1).padStart(2,'0');
    monthDates.push(`${new Date().getFullYear()}-${mm}-${dd}`);
  }
  // キャストごとに集計
  const summary={};
  monthDates.forEach(date=>{
    const saved=lsGet('attend_'+date);
    if(!saved) return;
    const att=JSON.parse(saved);
    Object.entries(att).forEach(([id,data])=>{
      if(!summary[id]) summary[id]={shifts:0,photos:0};
      if(data.working) summary[id].shifts++;
      if(data.photo) summary[id].photos++;
    });
  });
  if(!Object.keys(summary).length){ alert('今月の出勤記録がありません'); return; }
  if(!confirm(`今月(${ym})の出勤データを月次に反映します。既存データは上書きされます。`)) return;
  setSyncStatus('saving');
  for(const c of casts){
    const s=summary[c.id];
    if(!s) continue;
    const monthly=[...(c.monthly||[])];
    const idx=monthly.findIndex(m=>m.ym===ym);
    const existing=idx>=0?monthly[idx]:{};
    const entry={...existing,ym,shifts:s.shifts,photos:s.photos};
    if(idx>=0) monthly[idx]=entry; else monthly.push(entry);
    await updateDoc(doc(db,'casts',c.id),{monthly});
  }
  setSyncStatus('ok');
  alert(`集計完了！${Object.keys(summary).length}人分のデータを反映しました。売上・指名数は月次データから手入力してください。`);
}
window.autoAggregateMonth=autoAggregateMonth;
