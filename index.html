<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>キャスト管理DB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--bg2:#1a1a1f;--bg3:#222228;--border:#2e2e38;
  --text:#f0f0f5;--text2:#9090a8;--text3:#5a5a72;
  --accent:#a78bfa;--accent2:#7c5cf6;--success:#34d399;--danger:#f87171;--warn:#fbbf24;
  --radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh}
.app{max-width:420px;margin:0 auto;padding:0 0 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 12px}
.topbar-title{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.topbar-title span{color:var(--accent)}
.add-btn-main{background:var(--accent2);border:none;border-radius:var(--radius-sm);padding:0 16px;height:36px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.search-wrap{padding:0 16px 12px}
.search-input{width:100%;font-size:14px;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none;font-family:'Noto Sans JP',sans-serif}
.sync-bar{margin:0 16px 8px;font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text3)}
.tab-bar{display:flex;margin:0 16px 16px;background:var(--bg2);border-radius:var(--radius-sm);padding:4px;gap:2px}
.tab{flex:1;padding:8px 0;font-size:11px;font-weight:500;text-align:center;color:var(--text3);cursor:pointer;border:none;background:none;border-radius:6px;font-family:'Noto Sans JP',sans-serif}
.tab.active{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.sec{display:none;padding:0 16px}.sec.active{display:block}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;cursor:pointer}
.card.alert-border{border-color:var(--danger)}
.card.working-border{border-color:var(--success)}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.stat-l{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat-v{font-size:18px;font-weight:700}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;display:inline-block;margin-left:4px}
.badge-danger{background:rgba(248,113,113,0.2);color:var(--danger);border:1px solid var(--danger)}
.badge-warn{background:rgba(251,191,36,0.2);color:var(--warn);border:1px solid var(--warn)}
.empty{text-align:center;padding:60px 16px;color:var(--text3)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:16px}
.fl{font-size:12px;color:var(--text2);margin-bottom:6px;display:block}
.fg{margin-bottom:14px}
input,textarea{width:100%;font-size:14px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;font-family:'Noto Sans JP',sans-serif}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:none;line-height:1.6}
.brow{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-weight:700;font-family:'Noto Sans JP',sans-serif}
.btn-p{background:var(--accent2);color:#fff;border:none}
.btn-c{background:none;border:1px solid var(--border);color:var(--text2)}
.btn-danger{background:none;border:1px solid var(--danger);color:var(--danger)}
.detail-view{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:50;max-width:420px;margin:0 auto}
.detail-inner{padding:16px 16px 80px}
.back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2);background:none;border:none;cursor:pointer;padding:0;margin-bottom:20px;font-family:'Noto Sans JP',sans-serif}
.sec-label{font-size:11px;color:var(--text3);font-weight:700;margin:20px 0 8px;letter-spacing:1px;text-transform:uppercase}
.info-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;color:var(--text2);line-height:1.7}
.trend-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.trend-label{min-width:48px;color:var(--text2)}
.trend-bar-bg{flex:1;background:var(--bg3);border-radius:99px;height:6px;overflow:hidden}
.trend-bar{height:6px;border-radius:99px}
.trend-val{min-width:36px;text-align:right;font-weight:700}
.add-mini-btn{width:100%;padding:10px;font-size:13px;border:1px dashed var(--border);border-radius:var(--radius-sm);background:none;color:var(--text3);cursor:pointer;margin-top:8px;font-family:'Noto Sans JP',sans-serif}
.chat-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:8px}
.chat-msgs{min-height:60px;max-height:300px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.msg{font-size:13px;line-height:1.7;padding:10px 12px;border-radius:var(--radius-sm);max-width:95%}
.msg-user{background:var(--accent2);color:#fff;align-self:flex-end}
.msg-ai{background:var(--bg3);border:1px solid var(--border);align-self:flex-start;color:var(--text)}
.msg-thinking{color:var(--text3);font-size:12px;align-self:flex-start;padding:6px 0}
.chat-input-row{display:flex;gap:8px;align-items:flex-end}
.chat-input-row textarea{font-size:13px;padding:8px 12px;min-height:38px;max-height:80px}
.chat-send{flex-shrink:0;width:38px;height:38px;border-radius:var(--radius-sm);background:var(--accent2);color:#fff;border:none;cursor:pointer;font-size:18px}
.hist-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px}
.hist-date{font-size:11px;color:var(--text3);margin-bottom:6px}
.hist-content{font-size:13px;color:var(--text2);line-height:1.7}
.tap-btn{border:none;border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.tap-on{background:var(--success);color:#0f1f17}
.tap-off{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.tap-photo-on{background:var(--accent2);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-title">Cast<span>DB</span></div>
    <button class="add-btn-main" onclick="openAdd()">＋ 追加</button>
  </div>
  <div class="search-wrap">
    <input id="searchInput" class="search-input" type="text" placeholder="🔍 キャストを検索..." oninput="renderList()"/>
  </div>
  <div id="syncBar" class="sync-bar"><div class="sync-dot"></div><span>接続中...</span></div>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('list',this)">一覧</button>
    <button class="tab" onclick="switchTab('today',this)">出勤</button>
    <button class="tab" onclick="switchTab('ranking',this)">売上</button>
    <button class="tab" onclick="switchTab('consult',this)">相談</button>
    <button class="tab" onclick="switchTab('settings',this)">⚙️</button>
  </div>
  <div id="list" class="sec active"></div>
  <div id="today" class="sec"></div>
  <div id="ranking" class="sec"></div>
  <div id="consult" class="sec"></div>
  <div id="settings" class="sec"></div>
</div>

<!-- キャスト追加/編集 -->
<div id="addModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeAdd()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p id="addTitle" class="sheet-title">キャスト追加</p>
      <div class="fg"><label class="fl">源氏名</label><input id="f-name" placeholder="例：さくら"/></div>
      <div class="fg"><label class="fl">年齢</label><input id="f-age" type="number" placeholder="20" min="18"/></div>
      <div class="fg"><label class="fl">入店日</label><input id="f-tenure" type="date"/></div>
      <div class="fg"><label class="fl">プロフURL（任意）</label><input id="f-url" placeholder="https://..."/></div>
      <div class="fg"><label class="fl">強み・特徴</label><textarea id="f-strength" rows="2" placeholder="明るい、常連が多いなど"></textarea></div>
      <div class="fg"><label class="fl">課題・弱み</label><textarea id="f-weakness" rows="2" placeholder="遅刻が多め、ドリンクバック率低いなど"></textarea></div>
      <div class="fg"><label class="fl">趣味・好きなもの</label><textarea id="f-interests" rows="2" placeholder="野球（阪神）、アニメ（〇〇）など"></textarea></div>
      <div class="fg"><label class="fl">メモ</label><textarea id="f-memo" rows="2" placeholder="直近の面談内容など"></textarea></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeAdd()">キャンセル</button>
        <button id="saveBtn" class="btn btn-p" onclick="saveNew()">保存</button>
      </div>
      <div id="deleteBtnWrap" style="display:none;margin-top:10px">
        <button class="btn btn-danger" onclick="deleteCast()">このキャストを削除する</button>
      </div>
    </div>
  </div>
</div>

<!-- 月次データ -->
<div id="monthModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeMonthModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">月次データを追加</p>
      <div class="fg"><label class="fl">年月</label><input id="m-ym" type="month"/></div>
      <div class="fg"><label class="fl">売上（万円）</label><input id="m-sales" type="number" placeholder="0" step="0.1"/></div>
      <div class="fg"><label class="fl">指名数</label><input id="m-shimei" type="number" placeholder="0"/></div>
      <div class="fg"><label class="fl">出勤数</label><input id="m-shifts" type="number" placeholder="0"/></div>
      <div class="fg"><label class="fl">写メUP数</label><input id="m-photos" type="number" placeholder="0"/></div>
      <div class="fg"><label class="fl">メモ</label><textarea id="m-memo" rows="2" placeholder="今月の特記事項など"></textarea></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeMonthModal()">キャンセル</button>
        <button class="btn btn-p" onclick="saveMonth()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- TODO入力 -->
<div id="todoModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeTodoModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">TODOを追加</p>
      <div class="fg"><label class="fl">内容</label><input id="todo-text" placeholder="例：面談する、写メ督促など"/></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeTodoModal()">キャンセル</button>
        <button class="btn btn-p" onclick="saveTodo()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 面談メモ -->
<div id="memoModal" style="display:none">
  <div class="overlay" onclick="if(event.target===this)closeMemoModal()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <p class="sheet-title">メモを追加</p>
      <div class="fg"><label class="fl">日付</label><input id="memo-date" type="date"/></div>
      <div class="fg"><label class="fl">内容</label><textarea id="memo-content" rows="4" placeholder="○○さん最近アニメにハマってる、など何でもOK"></textarea></div>
      <div class="brow">
        <button class="btn btn-c" onclick="closeMemoModal()">キャンセル</button>
        <button class="btn btn-p" onclick="saveMemo()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- 詳細 -->
<div id="detailView" style="display:none">
  <div class="detail-view">
    <div class="detail-inner">
      <button class="back-btn" onclick="closeDetail()">← 一覧に戻る</button>
      <div id="detailContent"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, addDoc, arrayUnion, deleteDoc, setDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const FB = {
  apiKey:"AIzaSyAeSQpMbMASXGdNtKAkBFIAriuXEpilXzA",
  authDomain:"cast-management-47c1f.firebaseapp.com",
  projectId:"cast-management-47c1f",
  storageBucket:"cast-management-47c1f.firebasestorage.app",
  messagingSenderId:"1094441321205",
  appId:"1:1094441321205:web:b5daf7f9101042f1173bbc"
};
const app = initializeApp(FB);
const db = getFirestore(app);
const castsRef = collection(db,'casts');

const COLS=[
  {bg:'#3d2b6e',t:'#c4b5fd'},{bg:'#1a3a2e',t:'#6ee7b7'},
  {bg:'#3a1f1a',t:'#fca5a5'},{bg:'#2d1f3a',t:'#f0abfc'},
  {bg:'#1a2a3a',t:'#93c5fd'},{bg:'#1a3020',t:'#86efac'},
  {bg:'#3a2e1a',t:'#fde68a'},{bg:'#3a1f2a',t:'#f9a8d4'}
];

let casts=[], castsMap={};
let editTarget=null, monthTarget=null, memoTarget=null;
let chatHistories={};
let currentDetailId=null;
let attendanceDate=todayStr();

// ===== ユーティリティ =====
function col(i){ return COLS[i%COLS.length]; }
function ini(n){ return n ? n.slice(0,2) : '?'; }
function todayStr(){
  const d=new Date();
  return d.toISOString().slice(0,10);
}
function thisMonth(){
  return new Date().toISOString().slice(0,7);
}
function fmt(n){
  return Number(n).toLocaleString('ja-JP');
}
function getDaysAgo(n){
  const d=new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}
function formatDateBtn(s){
  const d=new Date(s);
  return (d.getMonth()+1)+'/'+(d.getDate());
}
function daysSince(dateStr){
  if(!dateStr) return 999;
  const now=new Date();
  const adj=new Date(now.getTime()-5*60*60*1000);
  const target=new Date(dateStr);
  return Math.floor((adj-target)/86400000);
}
function lastMemoDate(c){
  if(!c.memos||!c.memos.length) return null;
  const sorted=c.memos.slice().sort(function(a,b){ return b.date>a.date?1:-1; });
  return sorted[0].date;
}

// ===== localStorage =====
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function getKey(){ return lsGet('cast_apikey')||''; }

// ===== 出勤管理（Firebase同期） =====
let todayAttendance={};
let attendanceCache={};
let attendanceUnsubscribe=null;

function loadAttendance(date){
  attendanceDate=date;
  todayAttendance=attendanceCache[date]||{};
  if(attendanceUnsubscribe){ attendanceUnsubscribe(); attendanceUnsubscribe=null; }
  var attRef=doc(db,'attendance',date);
  attendanceUnsubscribe=onSnapshot(attRef,function(snap){
    if(snap.exists()){
      todayAttendance=snap.data().records||{};
    }else{
      todayAttendance={};
    }
    attendanceCache[date]=todayAttendance;
    renderToday();
    renderList();
  },function(e){ console.error(e); });
}

function preloadAttendance(){
  for(var i=0;i<=30;i++){
    (function(d){
      var attRef=doc(db,'attendance',d);
      onSnapshot(attRef,function(snap){
        if(snap.exists()){ attendanceCache[d]=snap.data().records||{}; }else{ attendanceCache[d]={}; }
        renderList();
      });
    })(getDaysAgo(i));
  }
}

async function saveAttendance(){
  var attRef=doc(db,'attendance',attendanceDate);
  await setDoc(attRef,{records:todayAttendance,date:attendanceDate});
  attendanceCache[attendanceDate]=todayAttendance;
}

function getAttend(id){ return todayAttendance[id]||{working:false,photo:false}; }
function lastAttendDate(id){
  for(var i=0;i<=30;i++){
    var d=getDaysAgo(i);
    var cache=attendanceCache[d];
    if(cache&&cache[id]&&cache[id].working) return d;
    var s=lsGet('attend_'+d);
    if(s){ var att=JSON.parse(s); if(att[id]&&att[id].working) return d; }
  }
  return null;
}
function lastPhotoDate(id){
  for(var i=0;i<=30;i++){
    var d=getDaysAgo(i);
    var cache=attendanceCache[d];
    if(cache&&cache[id]&&cache[id].photo) return d;
    var s=lsGet('attend_'+d);
    if(s){ var att=JSON.parse(s); if(att[id]&&att[id].photo) return d; }
  }
  return null;
}
function photoLabel(id){
  var date=lastPhotoDate(id);
  if(!date) return null;
  var days=daysSince(date);
  if(days===0) return '今日UP';
  if(days<=6) return days+'日前UP';
  return '7日以上前UP';
}
function photoColor(id){
  var date=lastPhotoDate(id);
  if(!date) return 'var(--text3)';
  var days=daysSince(date);
  if(days===0) return 'var(--success)';
  if(days<=3) return 'var(--accent)';
  if(days<=6) return 'var(--warn)';
  return 'var(--text3)';
}
function attendLabel(id){
  var date=lastAttendDate(id);
  if(!date) return null;
  var days=daysSince(date);
  if(days===0) return '今日出勤';
  if(days<=6) return days+'日前出勤';
  return '7日以上前出勤';
}
function attendColor(id){
  var date=lastAttendDate(id);
  if(!date) return 'var(--text3)';
  var days=daysSince(date);
  if(days===0) return 'var(--success)';
  if(days<=3) return 'var(--accent)';
  if(days<=6) return 'var(--warn)';
  return 'var(--text3)';
}
window.toggleAttend=function(id){
  var att=getAttend(id);
  todayAttendance[id]={working:!att.working,photo:att.working?false:att.photo};
  saveAttendance();
  renderToday();
};
window.togglePhoto=function(id){
  var att=getAttend(id);
  todayAttendance[id]={working:att.working,photo:!att.photo};
  saveAttendance();
  renderToday();
};
window.switchAttendDate=function(date){
  loadAttendance(date);
  renderToday();
};

// ===== Firebase =====
onSnapshot(query(castsRef,orderBy('createdAt','asc')),function(snap){
  casts=[]; castsMap={};
  snap.forEach(function(d){
    var data=Object.assign({id:d.id},d.data());
    casts.push(data);
    castsMap[d.id]=data;
    if(data.chatHistory) chatHistories['cast_'+d.id]=data.chatHistory;
  });
  render();
  setSyncStatus('ok');
  if(currentDetailId&&castsMap[currentDetailId]){
    var idx=casts.findIndex(function(c){ return c.id===currentDetailId; });
    if(idx>=0) renderDetailContent(idx);
  }
},function(e){ setSyncStatus('err'); console.error(e); });

function setSyncStatus(s){
  var el=document.getElementById('syncBar');
  if(s==='ok') el.innerHTML='<div class="sync-dot" style="background:var(--success)"></div><span>同期済み</span>';
  else if(s==='saving') el.innerHTML='<div class="sync-dot" style="background:var(--warn)"></div><span>保存中...</span>';
  else el.innerHTML='<div class="sync-dot" style="background:var(--danger)"></div><span>オフライン</span>';
}

// ===== タブ =====
window.switchTab=function(tab,el){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.sec').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(tab).classList.add('active');
  render();
};

function render(){ renderList(); renderToday(); renderRanking(); renderConsult(); renderSettings(); }

// ===== 一覧 =====
window.renderList=function(){
  var el=document.getElementById('list');
  var q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  if(!casts.length){
    el.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:12px">👥</div><p style="font-size:14px;line-height:1.8">キャストがまだいません</p></div>';
    return;
  }
  var sorted=casts.map(function(c,i){ return Object.assign({},c,{_i:i,days:daysSince(lastMemoDate(c))}); })
    .sort(function(a,b){ return b.days-a.days; });
  var filtered=q?sorted.filter(function(c){ return c.name.toLowerCase().indexOf(q)>=0; }):sorted;
  if(!filtered.length){
    el.innerHTML='<div class="empty" style="padding:40px 16px">該当するキャストが見つかりません</div>';
    return;
  }
  el.innerHTML=filtered.map(function(c){
    var cl=col(c._i);
    var months=(c.monthly||[]).slice().sort(function(a,b){ return b.ym>a.ym?1:-1; });
    var latest=months[0]||null;
    var prev=months[1]||null;
    var diff=null;
    if(latest&&prev) diff=+(latest.sales-prev.sales).toFixed(1);

function renderRanking(){

  var data=casts.map(function(c,i){
    var m=(c.monthly||[]).slice().sort(function(a,b){ return b.ym>a.ym?1:-1; });
    return Object.assign({},c,{_i:i,latest:m[0]||null,prev:m[1]||null});
  }).sort(function(a,b){
    var as=a.latest?a.latest.sales:0;
    var bs=b.latest?b.latest.sales:0;

  var max=data[0]&&data[0].latest?data[0].latest.sales:1;
  if(!max) max=1;
  var medals=['🥇','🥈','🥉'];
  el.innerHTML=data.map(function(c,rank){
    var cl=col(c._i);

  }).join('');

window.sendChat=async function(i){
  var c=casts[i];
  var inputEl=document.getElementById('chatInput_'+i);
  var text=inputEl.value.trim();
  if(!text) return;
  inputEl.value='';
  var chatKey='cast_'+c.id;
  chatHistories[chatKey].push({role:'user',content:text});
  var msgsEl=document.getElementById('chatMsgs_'+i);
  msgsEl.innerHTML=renderChatHist(chatHistories[chatKey])+'<div class="msg-thinking">考え中...</div>';
  msgsEl.scrollTop=msgsEl.scrollHeight;

  var months=(c.monthly||[]).slice().sort(function(a,b){ return a.ym>b.ym?1:-1; });
  var monthsText=months.length?months.map(function(m){
    return m.ym+'：売上'+m.sales+'万円 指名'+(m.shimei||'?')+'本 出勤'+(m.shifts||'?')+'回 写メUP'+(m.photos||'?')+'枚'+(m.memo?' ('+m.memo+')':'');
  }).join('\n'):'月次データなし';
  var memosText='なし'; if((c.memos||[]).length){ memosText=(c.memos||[]).map(function(m){ return m.date+'：'+m.content; }).join('\n'); }

  var sys='あなたはナイトワーク店舗のマネジメントアドバイザーです。以下のキャスト情報をもとに、オーナーの質問に的確で実践的なアドバイスを日本語で返してください。簡潔に、箇条書きも活用してください。\n\n「会話ネタ」「話題」「ネタ」などのキーワードが含まれる質問の場合は、必ずweb_searchツールを使ってキャストの趣味・好きなものに関する最新情報を検索してから回答してください。\n\n【キャスト名】'+c.name+'\n【年齢】'+(c.age||'不明')+'歳\n【入店日】'+(c.tenure||'不明')+'\n【趣味・好きなもの】'+(c.interests||'なし')+'\n【強み・特徴】'+(c.strength||'なし')+'\n【課題・弱み】'+(c.weakness||'なし')+'\n【月次データ（古い順）】\n'+monthsText+'\n【面談・メモ記録】\n'+memosText;

  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,system:sys,messages:chatHistories[chatKey],tools:[{type:'web_search_20250305',name:'web_search'}]})
    });
    var data=await res.json();
    var reply='';
    if(data.content){
      data.content.forEach(function(b){ if(b.type==='text') reply+=b.text; });
    }
    if(!reply) reply=(data.error&&data.error.message)||'エラーが発生しました';
    chatHistories[chatKey].push({role:'assistant',content:reply});
    try{ await updateDoc(doc(db,'casts',c.id),{chatHistory:chatHistories[chatKey]}); }catch(e){}
  }catch(e){
    chatHistories[chatKey].push({role:'assistant',content:'通信エラー。APIキーと接続を確認してください。'});
  }
  msgsEl.innerHTML=renderChatHist(chatHistories[chatKey]);
  msgsEl.scrollTop=msgsEl.scrollHeight;
};

};

// ===== 月次自動集計 =====
window.autoAggregateMonth=async function(){
  var ym=thisMonth();
  var summary={};
  var today=new Date();
  // 今月の全日付をFirebaseから取得
  for(var d=1;d<=today.getDate();d++){
    var mm=String(today.getMonth()+1).padStart(2,'0');
    var dd=String(d).padStart(2,'0');
    var dateStr=today.getFullYear()+'-'+mm+'-'+dd;
    // localStorageとFirebase両方チェック
    var s=lsGet('attend_'+dateStr);
    if(s){
      var att=JSON.parse(s);
      Object.keys(att).forEach(function(id){
        if(!summary[id]) summary[id]={shifts:0,photos:0};
        if(att[id]&&att[id].working) summary[id].shifts++;
        if(att[id]&&att[id].photo) summary[id].photos++;
      });
    }
  }
  // todayAttendanceも含める
  if(attendanceDate.slice(0,7)===ym){
    Object.keys(todayAttendance).forEach(function(id){
      if(!summary[id]) summary[id]={shifts:0,photos:0};
      var att=todayAttendance[id];
      if(att&&att.working) summary[id].shifts++;
      if(att&&att.photo) summary[id].photos++;
    });
  }
  if(!Object.keys(summary).length){ alert('今月の出勤記録がありません'); return; }
  if(!confirm('今月('+ym+')の出勤データを月次に反映します。')) return;
  setSyncStatus('saving');
  for(var j=0;j<casts.length;j++){
    var c=casts[j];
    var s2=summary[c.id];
    if(!s2) continue;
    var monthly=(c.monthly||[]).slice();
    var idx=monthly.findIndex(function(m){ return m.ym===ym; });
    var existing=idx>=0?monthly[idx]:{};
    var entry2=Object.assign({},existing,{ym:ym,shifts:s2.shifts,photos:s2.photos});
    if(idx>=0) monthly[idx]=entry2; else monthly.push(entry2);
    await updateDoc(doc(db,'casts',c.id),{monthly:monthly});
  }
  setSyncStatus('ok');
  alert('集計完了！売上・指名数は月次データから手入力してください。');
};
